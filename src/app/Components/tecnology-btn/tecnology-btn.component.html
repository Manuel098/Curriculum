<div class="relative inline-block text-left">
  <button (click)="toggleMenu()" class="icon-btn">
    <img [src]="img" alt="Tech" />
  </button>

  <div
    *ngIf="isOpen"
    class="
      absolute
      top-full
      left-1/2
      sm:left-0
      sm:right-auto
      transform
      -translate-x-1/2
      sm:translate-x-0
      mt-2
      w-64
      max-w-[90vw]
      origin-top-center
      sm:origin-top-left
      bg-white
      border
      border-gray-200
      rounded-md
      shadow-lg
      p-4
    "
  >
    <h2 class="text-base font-semibold">{{ title }}</h2>
    <p class="text-sm text-gray-600">{{ experience | translate }}</p>
  </div>
</div>
